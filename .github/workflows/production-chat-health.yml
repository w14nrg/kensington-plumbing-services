name: Production chat health

on:
  push:
    branches: [main]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Ken production health
        id: health
        continue-on-error: true
        shell: bash
        run: |
          set +e
          for attempt in $(seq 1 18); do
            response="$(curl -fsS --max-time 20 https://www.kensington.biz/api/health 2>/tmp/ken-health-error)"
            curl_status=$?

            if [ "$curl_status" -eq 0 ] && printf '%s' "$response" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True; assert d.get("service") == "ken-chat"; assert d.get("universalConversationContract") is True; assert d.get("explicitConversationRouting") is True; assert d.get("assistantTextExcludedFromRouting") is True; assert d.get("slotBasedQuestioning") is True; assert d.get("prematureDiagnosisRecovery") is True; assert d.get("smokeTestMode") is True; assert "slot-routing" in str(d.get("release"))'; then
              echo "Current routed chat release passed health check on attempt $attempt."
              exit 0
            fi

            echo "Waiting for current routed chat release (attempt $attempt)."
            sleep 10
          done

          cat /tmp/ken-health-error 2>/dev/null || true
          exit 1

      - name: Run exact live noisy-toilet estimate conversation
        id: conversation
        if: steps.health.outcome == 'success'
        continue-on-error: true
        env:
          KEN_URL: https://www.kensington.biz/api/ken
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import uuid

          url = os.environ["KEN_URL"]
          session_id = f"health-{uuid.uuid4()}"
          history = []
          state = {}

          def send(message):
              request = urllib.request.Request(
                  url,
                  data=json.dumps({
                      "message": message,
                      "sessionId": session_id,
                      "history": history,
                      "state": state,
                  }).encode("utf-8"),
                  method="POST",
                  headers={
                      "content-type": "application/json",
                      "x-ken-smoke-test": "1",
                      "user-agent": "Ken production smoke test",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  assert response.status == 200
                  data = json.loads(response.read().decode("utf-8"))
                  assert response.headers.get("x-ken-mode") == "smoke"
                  assert "slot-routing" in str(response.headers.get("x-ken-entry"))
                  assert response.headers.get("x-ken-contract") == "universal-v1"
                  assert response.headers.get("x-ken-route") == "explicit-family-v1"
                  assert data.get("contractVersion") == "universal-v1"
                  return data

          messages = [
              "My toilet has a problem",
              "It's like making noise",
              "It's got a flush at the top",
              "What you on about",
          ]
          transcript = []

          for message in messages:
              data = send(message)
              reply = str(data.get("reply") or "")
              transcript.append((message, reply, data))
              history.append({"role": "user", "content": message})
              history.append({"role": "assistant", "content": reply})
              state = data.get("state") or {}
              time.sleep(0.2)

          assert "what is the toilet actually doing" in transcript[0][1].lower(), transcript
          assert "is it a normal visible cistern" in transcript[1][1].lower(), transcript

          for label, turn in [("estimate", transcript[2]), ("follow-up", transcript[3])]:
              reply = turn[1].lower()
              data = turn[2]
              estimate = data.get("estimate")
              assert data.get("topicLocked") is not True, (label, transcript)
              assert data.get("showEstimateNow") is True, (label, data)
              assert isinstance(estimate, dict), (label, data)
              assert estimate.get("jobCode") == "wc_inlet_valve", (label, estimate)
              assert int(estimate.get("min") or 0) > 0, (label, estimate)
              assert int(estimate.get("max") or 0) >= int(estimate.get("min") or 0), (label, estimate)
              assert "got enough plumbing information" not in reply, (label, reply)
              assert "i only help with plumbing problems" not in reply, (label, reply)
              assert "£" in reply, (label, reply)

          print("Live noisy-toilet conversation passed.")
          PY

      - name: Publish production monitor status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const healthOutcome = '${{ steps.health.outcome }}';
            const conversationOutcome = '${{ steps.conversation.outcome }}';
            const healthy = healthOutcome === 'success' && conversationOutcome === 'success';
            const title = 'Ken production monitor status';
            const body = [
              healthy ? '## ✅ Ken production chat is healthy' : '## ❌ Ken production chat check failed',
              '',
              `Last checked: ${new Date().toISOString()}`,
              `Current routed release: **${healthOutcome}**`,
              `Noisy-toilet estimate conversation: **${conversationOutcome}**`,
              '',
              healthy
                ? 'The current slot-routing release is live and the full noisy-toilet estimate conversation passed.'
                : 'Do not rely on Ken until the failing production check has been investigated.',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            let issue = issues.find(item => !item.pull_request && item.title === title);
            if (!issue) {
              issue = (await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              })).data;
            }
            const update = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body,
              state: healthy ? 'closed' : 'open'
            };
            if (healthy) update.state_reason = 'completed';
            await github.rest.issues.update(update);

      - name: Fail when production is unhealthy
        if: always() && (steps.health.outcome == 'failure' || steps.conversation.outcome != 'success')
        run: exit 1
