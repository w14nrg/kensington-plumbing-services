name: Production chat health

on:
  push:
    branches: [main]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Ken production health
        id: health
        continue-on-error: true
        shell: bash
        run: |
          set +e
          for attempt in $(seq 1 18); do
            response="$(curl -fsS --max-time 20 https://www.kensington.biz/api/health 2>/tmp/ken-health-error)"
            curl_status=$?

            if [ "$curl_status" -eq 0 ] && printf '%s' "$response" | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("ok") is True; assert data.get("service") == "ken-chat"; assert data.get("stateGuard") is True; assert data.get("contextualReplies") is True; assert data.get("estimateCompletionGuard") is True; assert data.get("universalConversationContract") is True; assert data.get("realUsersKeepAIRoute") is True; assert data.get("smokeTestMode") is True'; then
              echo "Production chat health check passed on attempt $attempt."
              exit 0
            fi

            echo "Attempt $attempt did not return the expected protected chat release."
            sleep 10
          done

          echo "Production chat health check failed after all retries."
          cat /tmp/ken-health-error 2>/dev/null || true
          exit 1

      - name: Run exact live estimate conversation
        id: conversation
        if: steps.health.outcome == 'success'
        continue-on-error: true
        env:
          KEN_URL: https://www.kensington.biz/api/ken
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import uuid

          url = os.environ["KEN_URL"]
          session_id = f"health-{uuid.uuid4()}"
          history = []
          state = {}

          def send(message):
              payload = {
                  "message": message,
                  "sessionId": session_id,
                  "history": history,
                  "state": state,
              }
              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  method="POST",
                  headers={
                      "content-type": "application/json",
                      "x-ken-smoke-test": "1",
                      "user-agent": "Ken production smoke test",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise AssertionError(f"Unexpected HTTP status {response.status}")
                  data = json.loads(response.read().decode("utf-8"))
                  mode = response.headers.get("x-ken-mode")
                  release = response.headers.get("x-ken-entry")
                  contract = response.headers.get("x-ken-contract")
                  if mode != "smoke":
                      raise AssertionError(f"Expected smoke mode, received {mode!r}")
                  if "universal-contract" not in str(release):
                      raise AssertionError(f"Unexpected release {release!r}")
                  if contract != "universal-v1":
                      raise AssertionError(f"Unexpected contract {contract!r}")
                  if data.get("contractVersion") != "universal-v1":
                      raise AssertionError(f"Missing universal contract payload: {data!r}")
                  return data

          messages = [
              "My toilet has a problem",
              "It's like making noise",
              "It's got a flush at the top",
              "What you on about",
          ]
          transcript = []

          for message in messages:
              data = send(message)
              reply = str(data.get("reply") or "")
              transcript.append((message, reply, data))
              history.append({"role": "user", "content": message})
              history.append({"role": "assistant", "content": reply})
              state = data.get("state") or {}
              time.sleep(0.2)

          first_reply = transcript[0][1].lower()
          second_reply = transcript[1][1].lower()
          estimate_turn = transcript[2][2]
          estimate_reply = transcript[2][1].lower()
          followup_turn = transcript[3][2]
          followup_reply = transcript[3][1].lower()

          assert "what is the toilet actually doing" in first_reply, transcript
          assert "is it a normal visible cistern" in second_reply, transcript

          for label, data, reply in [
              ("estimate turn", estimate_turn, estimate_reply),
              ("follow-up turn", followup_turn, followup_reply),
          ]:
              estimate = data.get("estimate")
              assert data.get("topicLocked") is not True, (label, transcript)
              assert data.get("showEstimateNow") is True, (label, data)
              assert isinstance(estimate, dict), (label, data)
              assert estimate.get("jobCode") == "wc_inlet_valve", (label, estimate)
              assert int(estimate.get("min") or 0) > 0, (label, estimate)
              assert int(estimate.get("max") or 0) >= int(estimate.get("min") or 0), (label, estimate)
              assert "got enough plumbing information" not in reply, (label, reply)
              assert "i only help with plumbing problems" not in reply, (label, reply)
              assert "£" in reply, (label, reply)

          print("Exact production estimate conversation passed:")
          for message, reply, data in transcript:
              estimate = data.get("estimate") or {}
              print(f"USER: {message}")
              print(f"KEN:  {reply}")
              if estimate:
                  print(f"ESTIMATE: £{estimate.get('min')}–£{estimate.get('max')} ({estimate.get('jobCode')})")
          PY

      - name: Publish production monitor status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const healthOutcome = '${{ steps.health.outcome }}';
            const conversationOutcome = '${{ steps.conversation.outcome }}';
            const healthy = healthOutcome === 'success' && conversationOutcome === 'success';
            const title = 'Ken production monitor status';
            const checkedAt = new Date().toISOString();
            const body = [
              healthy ? '## ✅ Ken production chat is healthy' : '## ❌ Ken production chat check failed',
              '',
              `Last checked: ${checkedAt}`,
              `Health endpoint: **${healthOutcome}**`,
              `Exact estimate conversation: **${conversationOutcome}**`,
              '',
              'The live website conversation tested is:',
              '1. `My toilet has a problem`',
              '2. `It’s like making noise`',
              '3. `It’s got a flush at the top`',
              '4. `What you on about`',
              '',
              healthy
                ? 'Ken displayed a real toilet estimate on turns 3 and 4 and did not return the false “estimate ready” dead end.'
                : 'Do not rely on the chat until the failing workflow run has been investigated.',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });

            let issue = issues.find(item => !item.pull_request && item.title === title);
            if (!issue) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
              issue = created.data;
            }

            const update = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body,
              state: healthy ? 'closed' : 'open'
            };
            if (healthy) update.state_reason = 'completed';

            await github.rest.issues.update(update);

      - name: Fail when production is unhealthy
        if: always() && (steps.health.outcome == 'failure' || steps.conversation.outcome != 'success')
        run: exit 1
