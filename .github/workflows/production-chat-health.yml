name: Production chat health

on:
  push:
    branches: [main]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Ken production health
        id: health
        continue-on-error: true
        shell: bash
        run: |
          set +e
          for attempt in $(seq 1 18); do
            response="$(curl -fsS --max-time 20 https://www.kensington.biz/api/health 2>/tmp/ken-health-error)"
            curl_status=$?

            if [ "$curl_status" -eq 0 ] && printf '%s' "$response" | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("ok") is True; assert data.get("service") == "ken-chat"; assert data.get("stateGuard") is True; assert data.get("contextualReplies") is True; assert data.get("smokeTestMode") is True'; then
              echo "Production chat health check passed on attempt $attempt."
              exit 0
            fi

            echo "Attempt $attempt did not return the expected protected chat release."
            sleep 10
          done

          echo "Production chat health check failed after all retries."
          cat /tmp/ken-health-error 2>/dev/null || true
          exit 1

      - name: Run exact live conversation smoke test
        id: conversation
        if: steps.health.outcome == 'success'
        continue-on-error: true
        env:
          KEN_URL: https://www.kensington.biz/api/ken
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import uuid

          url = os.environ["KEN_URL"]
          session_id = f"health-{uuid.uuid4()}"
          history = []
          state = {}

          def send(message):
              payload = {
                  "message": message,
                  "sessionId": session_id,
                  "history": history,
                  "state": state,
              }
              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  method="POST",
                  headers={
                      "content-type": "application/json",
                      "x-ken-smoke-test": "1",
                      "user-agent": "Ken production smoke test",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise AssertionError(f"Unexpected HTTP status {response.status}")
                  data = json.loads(response.read().decode("utf-8"))
                  mode = response.headers.get("x-ken-mode")
                  release = response.headers.get("x-ken-entry")
                  if mode != "smoke":
                      raise AssertionError(f"Expected smoke mode, received {mode!r}")
                  if "context-guard" not in str(release):
                      raise AssertionError(f"Unexpected release {release!r}")
                  return data

          transcript = []
          for message in ["My toilet has a problem", "Leaking", "Not sure"]:
              data = send(message)
              reply = str(data.get("reply") or "")
              transcript.append((message, reply, data))
              history.append({"role": "user", "content": message})
              history.append({"role": "assistant", "content": reply})
              state = data.get("state") or {}
              time.sleep(0.2)

          first = transcript[0][1].lower()
          second = transcript[1][1].lower()
          final_data = transcript[2][2]
          final_reply = transcript[2][1].lower()
          final_state = final_data.get("state") or {}

          assert "what is the toilet actually doing" in first, transcript
          assert "is it a normal visible cistern" in second, transcript
          assert final_data.get("topicLocked") is not True, transcript
          assert "i only help with plumbing problems" not in final_reply, transcript
          assert str(final_state.get("problemSummary") or final_state.get("symptomDetail") or "").strip(), final_state
          assert int(final_state.get("fallbackStep") or 0) >= 2, final_state

          print("Exact production conversation passed:")
          for message, reply, _ in transcript:
              print(f"USER: {message}")
              print(f"KEN:  {reply}")
          PY

      - name: Publish production monitor status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const healthOutcome = '${{ steps.health.outcome }}';
            const conversationOutcome = '${{ steps.conversation.outcome }}';
            const healthy = healthOutcome === 'success' && conversationOutcome === 'success';
            const title = 'Ken production monitor status';
            const checkedAt = new Date().toISOString();
            const body = [
              healthy ? '## ✅ Ken production chat is healthy' : '## ❌ Ken production chat check failed',
              '',
              `Last checked: ${checkedAt}`,
              `Health endpoint: **${healthOutcome}**`,
              `Exact conversation test: **${conversationOutcome}**`,
              '',
              'The conversation tested on the live website is:',
              '1. `My toilet has a problem`',
              '2. `Leaking`',
              '3. `Not sure`',
              '',
              healthy
                ? 'Ken continued the plumbing conversation without returning the off-topic lock message.'
                : 'Do not rely on the chat until the failing workflow run has been investigated.',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });

            let issue = issues.find(item => !item.pull_request && item.title === title);
            if (!issue) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
              issue = created.data;
            }

            const update = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body,
              state: healthy ? 'closed' : 'open'
            };
            if (healthy) update.state_reason = 'completed';

            await github.rest.issues.update(update);

      - name: Fail when production is unhealthy
        if: always() && (steps.health.outcome == 'failure' || steps.conversation.outcome != 'success')
        run: exit 1
