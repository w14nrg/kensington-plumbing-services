name: Production chat matrix

on:
  push:
    branches: [main]
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

concurrency:
  group: production-chat-matrix
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for protected chat release
        shell: bash
        run: |
          set +e
          for attempt in $(seq 1 24); do
            response="$(curl -fsS --max-time 20 https://www.kensington.biz/api/health 2>/tmp/ken-matrix-health-error)"
            status=$?
            if [ "$status" -eq 0 ] && printf '%s' "$response" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("universalConversationContract") is True; assert d.get("explicitConversationRouting") is True; assert d.get("assistantTextExcludedFromRouting") is True; assert d.get("slotBasedQuestioning") is True; assert d.get("prematureDiagnosisRecovery") is True'; then
              echo "Protected chat release is live."
              exit 0
            fi
            echo "Waiting for production deployment (attempt $attempt)."
            sleep 10
          done
          cat /tmp/ken-matrix-health-error 2>/dev/null || true
          exit 1

      - name: Test several live plumbing journeys
        id: journeys
        continue-on-error: true
        env:
          KEN_URL: https://www.kensington.biz/api/ken
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import uuid

          url = os.environ["KEN_URL"]
          scenarios = {
              "noisy toilet": [
                  "My toilet has a problem",
                  "It's like making noise",
                  "It's got a flush at the top",
                  "What you on about",
              ],
              "toilet pipe leak": [
                  "My toilet is leaking",
                  "It's coming from the pipe at the back",
                  "What",
                  "It's the small thin water pipe",
              ],
              "dripping tap": [
                  "My kitchen tap is dripping",
                  "From the spout",
                  "Single lever mixer",
              ],
              "ceiling leak": [
                  "There is water coming through the ceiling",
                  "I can see it on the ceiling",
                  "Not sure where it starts",
              ],
              "cold radiator": [
                  "My radiator is cold",
                  "It is not heating",
                  "Only one radiator",
              ],
              "slow kitchen sink": [
                  "My kitchen sink drains slowly",
                  "Kitchen sink",
                  "It still drains but very slowly",
              ],
              "unclear plumbing fault": [
                  "Something is wrong with the plumbing",
                  "There is a banging noise near the pipes",
                  "It happens when I turn a tap off",
              ],
          }

          def normalise(value):
              return " ".join(str(value or "").lower().split())

          all_results = {}
          for scenario, messages in scenarios.items():
              history = []
              state = {}
              session_id = f"matrix-{uuid.uuid4()}"
              transcript = []

              for message in messages:
                  request = urllib.request.Request(
                      url,
                      data=json.dumps({
                          "message": message,
                          "sessionId": session_id,
                          "history": history,
                          "state": state,
                      }).encode("utf-8"),
                      method="POST",
                      headers={
                          "content-type": "application/json",
                          "x-ken-smoke-test": "1",
                          "user-agent": "Ken production matrix",
                      },
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      assert response.status == 200, (scenario, response.status)
                      contract = response.headers.get("x-ken-contract")
                      route = response.headers.get("x-ken-route")
                      mode = response.headers.get("x-ken-mode")
                      assert contract == "universal-v1", (scenario, contract)
                      assert route == "explicit-family-v1", (scenario, route)
                      assert mode == "smoke", (scenario, mode)
                      data = json.loads(response.read().decode("utf-8"))

                  reply = str(data.get("reply") or "")
                  assert reply.strip(), (scenario, message, data)
                  assert data.get("contractVersion") == "universal-v1", (scenario, data)
                  assert data.get("topicLocked") is not True, (scenario, message, data)
                  if history and history[-1].get("role") == "assistant":
                      assert normalise(reply) != normalise(history[-1].get("content")), (scenario, transcript, reply)

                  lower = reply.lower()
                  claims_estimate = "estimate" in lower and any(word in lower for word in ["ready", "shown", "below", "current"])
                  if claims_estimate:
                      assert isinstance(data.get("estimate"), dict), (scenario, message, data)
                      assert data.get("showEstimateNow") is True, (scenario, message, data)

                  transcript.append((message, reply, data))
                  history.append({"role": "user", "content": message})
                  history.append({"role": "assistant", "content": reply})
                  state = data.get("state") or {}

              if scenario == "toilet pipe leak":
                  first = transcript[0][1].lower()
                  second = transcript[1][1].lower()
                  third = transcript[2][1].lower()
                  assert "where is the toilet leaking from" in first, transcript
                  assert "small water-supply pipe" in second and "waste connector" in second, transcript
                  assert "£75" not in transcript[1][1], transcript
                  assert "thin" in third and "large toilet outlet pipe" in third, transcript
                  assert "£75" not in transcript[2][1], transcript

              final = transcript[-1][2]
              estimate = final.get("estimate")
              assert isinstance(estimate, dict), (scenario, transcript)
              assert final.get("showEstimateNow") is True, (scenario, final)
              assert int(estimate.get("min") or 0) > 0, (scenario, estimate)
              assert int(estimate.get("max") or 0) >= int(estimate.get("min") or 0), (scenario, estimate)
              assert "£" in transcript[-1][1], (scenario, transcript[-1][1])

              if scenario == "toilet pipe leak":
                  assert estimate.get("jobCode") == "wc_supply_pipe_leak", estimate
                  assert int(estimate.get("min")) == 95, estimate
                  assert int(estimate.get("max")) == 195, estimate
                  assert final.get("flowVersion") == "slot-engine-v1", final

              all_results[scenario] = {
                  "jobCode": estimate.get("jobCode"),
                  "min": estimate.get("min"),
                  "max": estimate.get("max"),
                  "repairs": final.get("contractRepairs") or [],
                  "flow": final.get("flowVersion"),
              }

          print(json.dumps(all_results, indent=2))
          PY

      - name: Publish matrix status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const healthy = '${{ steps.journeys.outcome }}' === 'success';
            const title = 'Ken production conversation matrix';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const checkedAt = new Date();
            const body = [
              healthy ? '## ✅ Ken conversation matrix is healthy' : '## ❌ Ken conversation matrix failed',
              '',
              `Last checked: ${checkedAt.toISOString()}`,
              `Live multi-journey test: **${{ steps.journeys.outcome }}**`,
              '',
              'The live site was tested through seven plumbing journeys:',
              '- noisy toilet',
              '- toilet leak from a pipe at the back, including `What` clarification',
              '- dripping tap',
              '- ceiling leak',
              '- cold radiator',
              '- slow kitchen sink',
              '- unclear/banging plumbing fault',
              '',
              healthy
                ? 'Every journey avoided repeated replies and topic locks, and finished with a visible price. The toilet-pipe journey asked for the missing pipe detail before pricing and did not prematurely offer £75 diagnosis.'
                : 'Do not rely on Ken until the failing journey has been investigated.',
              '',
              `Workflow run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            ].join('\n');

            const { data: currentRun } = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: context.runId
            });
            const currentStartedAt = new Date(currentRun.run_started_at || currentRun.created_at || 0);

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'all',
              per_page: 100
            });
            let issue = issues.find(item => !item.pull_request && item.title === title);
            if (!issue) {
              issue = (await github.rest.issues.create({ owner, repo, title, body })).data;
            }

            const previousMatch = String(issue.body || '').match(/Last checked:\s*([^\n]+)/i);
            const previousCheckedAt = previousMatch ? new Date(previousMatch[1].trim()) : null;
            if (previousCheckedAt && !Number.isNaN(previousCheckedAt.valueOf()) && previousCheckedAt > currentStartedAt) {
              core.info(`Skipping stale status update from run ${context.runId}; a newer result is already published.`);
              return;
            }

            const update = {
              owner,
              repo,
              issue_number: issue.number,
              body,
              state: healthy ? 'closed' : 'open'
            };
            if (healthy) update.state_reason = 'completed';
            await github.rest.issues.update(update);

      - name: Fail when any journey is unhealthy
        if: always() && steps.journeys.outcome != 'success'
        run: exit 1
